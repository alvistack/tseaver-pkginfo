# GitHub-based CI, mirroring the local 'tox' gate:
#
#   tox env       CI job(s)
#   ---------     -------------------------------------------------
#   py310..py314  'test' (matrix w/ per-version coverage data)
#   + pypy3
#   cover         'coverage' (combined report, --fail-under=100)
#   mypy          'mypy' (incl. per-module stubtest drift checks)
#   manifest      'manifest'
#   docs          'docs' (html + doctest builds)
#
# Intentionally does NOT use tox, as belt-and-suspenders during the
# modernization effort (#5), until releases get automated (#6).

name: CI

on:
  push:
    branches:
      - main
      - v*
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', 'pypy-3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: python -m pip install -e '.[testing]'

      - name: Run tests, recording coverage data
        env:
          # unique-per-job data file, for later aggregation; non-hidden
          # name, as upload-artifact@v4 excludes dotfiles by default
          COVERAGE_FILE: coverage-gh-${{ matrix.python-version }}
        run: pytest --cov=pkginfo --cov-report= -q

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-gh-${{ matrix.python-version }}
          if-no-files-found: error

  coverage:
    name: coverage aggregate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install coverage
        run: python -m pip install coverage

      - name: Download per-version coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Flatten and combine
        run: |
          find coverage-data -type f -name 'coverage-gh-*' \
            -exec mv {} . \;
          coverage combine coverage-gh-*

      - name: "Report (gate 100%)"
        run: coverage report --fail-under=100

  mypy:
    name: type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up python 3.12 (pinned to match local tox: py3.13's dunders
          (e.g., `__firstlineno__`) break stubtest against the current stubs)"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install 'mypy==0.991' types-setuptools

      - name: Type-check sources and stubs
        run: |
          mypy
          stubtest pkginfo.bdist
          stubtest pkginfo.commandline
          stubtest pkginfo.develop
          stubtest pkginfo.distribution
          stubtest pkginfo.index
          stubtest pkginfo.installed
          stubtest pkginfo.sdist
          stubtest pkginfo.utils
          stubtest pkginfo.wheel

  manifest:
    name: check sdist manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: python -m pip install check-manifest

      - name: Check manifest vs. VCS files
        run: check-manifest

  docs:
    name: docs build and doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install Sphinx

      - name: Build HTML docs
        run: sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Run doctests
        run: sphinx-build -b doctest -d docs/_build/doctrees docs docs/_build/doctest