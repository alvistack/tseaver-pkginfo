[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "pkginfo"
version = "1.14dev0"
description = "Query metadata from sdists / bdists / installed packages"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"
keywords = ["distribution", "sdist", "installed", "metadata"]
license-files = [
    "LICENSE.txt",
]
authors = [
  { name = "Tres Seaver, Agendaless Consulting", email = "tseaver@agendaless.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
]

[project.urls]
Repository = "https://github.com/tseaver/pkginfo"
Issues = "https://github.com/tseaver/pkginfo/issues"
Changelog = "https://github.com/tseaver/pkginfo/releases"

[project.optional-dependencies]
testing = [
    "wheel",
    "pytest",
    "pytest-cov",
]

[project.entry-points.console_scripts]
pkginfo = "pkginfo.commandline:main"

[dependency-groups]
dev = [
    "tox",
    "pytest",
    "pytest-cov",
    "ruff",
    "check-manifest",
    "build",
    "twine",
]
docs = [
    "sphinx",
]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
minversion = "6.0"
python_files = "test_*.py"
testpaths = [ "tests" ]

[tool.coverage.run]
source=["pkginfo", "tests"]
omit = []

[tool.coverage.report]
show_missing = true


[tool.check-manifest]
# We actually *do* mean to check these into version control:  they are
# testcase pacakge metadata.
ignore-bad-ideas = [
    "PKG-INFO",
    "*.egg-info",
]
# dev-lock files:  tracked here, but not shippped in the sdist
ignore = [
    "uv.lock",
]

[tool.mypy]
packages = "pkginfo"
exclude = "tests"
# --strict settings
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# Enabling this will fail on subclasses of untyped imports, e.g. pkginfo
# disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
