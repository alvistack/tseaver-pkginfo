[tox]
envlist = 
    clean,py311,py312,py313,py314,py315,pypy312,cover,docs,mypy,manifest

[testenv:clean]
basepython =
    python3.13
deps =
commands = 
    python -c "import os; os.path.exists('.coverage') and os.remove('.coverage')"
depends = 

[testenv]
usedevelop = true
commands = 
    pytest --cov=pkginfo --cov-append --cov-report=
deps =
    wheel
    pytest
    pytest-cov
depends =
    clean

[testenv:py315]
# Virtualenv's embedded pip seeds (25.0.1 / 25.1.1) cannot bootstrap on
# Python 3.15, which has dropped 'typing.no_type_check_decorator'; let
# virtualenv download the current pip at env-creation time instead.
# Drop this stanza whenever its embedded seeds support 3.15.
download = true

[testenv:cover]
basepython =
    python3.13
commands = 
    coverage report --fail-under=100
deps =
    coverage
depends =
    py311,py312,py313,py314,py315,pypy312

[testenv:docs]
basepython =
    python3.13
commands = 
    sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
    sphinx-build -b doctest -d docs/_build/doctrees docs docs/_build/doctest
deps =
    Sphinx

[testenv:mypy]
usedevelop = true
# ---------------------------------------------------------------------------
# Patches accepted to move this stanza beyond 3.12.
# ---------------------------------------------------------------------------
# python3.13 introduces `__firstlineno__` and `__static_attributes__`, whic
# subtest then whines aren't declared in the stubs.
# ---------------------------------------------------------------------------
basepython =
    python3.12
commands = 
    mypy
    stubtest pkginfo.bdist
    stubtest pkginfo.commandline
    stubtest pkginfo.develop
    stubtest pkginfo.distribution
    stubtest pkginfo.index
    stubtest pkginfo.installed
    stubtest pkginfo.sdist
    stubtest pkginfo.utils
    stubtest pkginfo.wheel
deps =
    mypy==0.991
    types-setuptools

[testenv:manifest]
basepython =
    python3.13
deps =
    check-manifest
    breezy
allowlist_externals = ln
commands = 
    ln -sf {envdir}/bin/brz {envdir}/bin/bzr
    check-manifest
